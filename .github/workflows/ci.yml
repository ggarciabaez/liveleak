name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --with ruff ruff check --isolated tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Test subset only: skips tensorrt/lap and uses CPU torch so no GPU or weights are needed.
      - name: Install test dependencies
        run: |
          uv venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install numpy scipy opencv-python-headless supervision ultralytics trackers \
            filterpy torch-geometric tqdm pytest pytest-cov
      - name: Unit tests
        run: uv run --no-project pytest --cov=modules --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml